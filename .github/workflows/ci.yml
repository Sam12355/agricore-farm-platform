name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push to the same branch cancels the previous run. Without this a busy branch
# queues runs behind each other and the feedback loop gets slower the more you push.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Test secrets, generated for the job and used nowhere else. The config schema
  # requires 32+ characters and three distinct values, so these satisfy it without
  # implying anything real.
  JWT_ACCESS_SECRET: ci-access-secret-0000000000000000000000
  JWT_REFRESH_SECRET: ci-refresh-secret-111111111111111111111
  JWT_WORKER_VIEW_SECRET: ci-worker-secret-222222222222222222222

jobs:
  quality:
    name: lint, type-check, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build:packages

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm typecheck

      # The whole suite runs against in-memory adapters. No service containers are
      # declared here on purpose: if CI needed Postgres to run unit tests, so would
      # every contributor.
      - name: Unit and integration tests
        run: pnpm --filter @agricore/api test

      - name: End-to-end tests
        run: pnpm --filter @agricore/api test:e2e

      - name: Shared package tests
        run: pnpm --filter "./packages/**" -r test

  web:
    name: web build and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:packages
      - run: pnpm --filter @agricore/web test
      - run: pnpm --filter @agricore/web build

  playwright:
    name: browser journeys
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:packages
      - name: Install browsers
        run: pnpm --filter @agricore/web exec playwright install --with-deps chromium
      - run: pnpm --filter @agricore/web test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7

  docker:
    name: container build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infrastructure/docker/api.Dockerfile
          # Built but not pushed. Pushing an image is a deployment action and the brief
          # requires explicit approval for those.
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  terraform:
    name: terraform format and validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
      - name: Format check
        run: terraform fmt -check -recursive infrastructure/terraform
      - name: Validate
        # No backend, so no credentials and no state access. This checks that the
        # configuration is syntactically and semantically valid, nothing more.
        run: |
          cd infrastructure/terraform/environments/dev
          terraform init -backend=false
          terraform validate

  security:
    name: dependency and secret scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history, because a secret committed and then removed is still a secret
          # that leaked, and a shallow clone would not find it.
          fetch-depth: 0

      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Dependency audit
        # Moderate and above fails the build. Low-severity advisories in dev tooling
        # are noted rather than blocking, which keeps the gate meaningful.
        run: pnpm audit --audit-level moderate

      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  android:
    name: android build and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Assemble debug
        working-directory: apps/android
        # No wrapper binary is committed, so the gradle provided by setup-gradle is used.
        run: gradle --no-daemon assembleDebug
      - name: Unit tests
        working-directory: apps/android
        run: gradle --no-daemon testDebugUnitTest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-test-results
          path: apps/android/app/build/reports/tests/
          retention-days: 7

  ios:
    name: ios build and tests
    # macOS minutes are billed at a multiple of Linux, so this runs on main and on
    # pull requests explicitly labelled ios, rather than on every push.
    runs-on: macos-14
    if: github.event_name == 'push' || contains(github.event.pull_request.labels.*.name, 'ios')
    steps:
      - uses: actions/checkout@v4
      - name: Generate the Xcode project
        run: |
          brew install xcodegen
          cd apps/ios && xcodegen generate

      - name: Show available SDKs
        run: xcodebuild -showsdks
      - name: Build and test
        working-directory: apps/ios
        # No signing. A simulator build does not need a certificate, and this repository
        # deliberately contains no signing assets.
        run: |
          xcodebuild test \
            -project AgriCore.xcodeproj \
            -scheme AgriCore \
            -destination 'platform=iOS Simulator,name=iPhone 15,OS=latest' \
            CODE_SIGNING_ALLOWED=NO
