# GraphQL surface for the manager console.
#
# Read model and live updates only. Every mutation stays on REST, and that split is
# deliberate rather than an omission:
#
#   - The console's reads are nested and vary per screen. The queue wants a summary, the
#     detail panel wants an alert plus its timeline plus its notifications in one round
#     trip. That is what GraphQL is good at, and it is what REST makes awkward.
#
#   - The mutations are the opposite. They need an Idempotency-Key header, a precise status
#     code, a Retry-After on 429, and a 409 carrying the current version. All of that is
#     HTTP semantics that GraphQL flattens into a 200 with an errors array, and the mobile
#     clients depend on it.
#
# So: GraphQL where nested reads help, REST where the transport semantics matter.

scalar DateTime

enum AlertStatus {
  active
  acknowledged
  resolved
  cancelled
}

enum AlertPriority {
  low
  standard
  high
  critical
}

enum AlertTrigger {
  field_countdown
  manual_report
  operation_overdue
  manager_created
}

enum ActorType {
  user
  manager
  worker
  system
}

type GeoPoint {
  latitude: Float!
  longitude: Float!
  accuracyMetres: Float!
  capturedAt: DateTime!
}

type AlertEvent {
  id: ID!
  "Per-alert monotonic sequence. Order by this, never by a timestamp."
  sequence: Int!
  type: String!
  actorType: ActorType!
  actorId: ID
  "When it happened, which is not always when the server heard about it."
  occurredAt: DateTime!
  recordedAt: DateTime!
}

type Alert {
  id: ID!
  status: AlertStatus!
  priority: AlertPriority!
  trigger: AlertTrigger!
  activatedAt: DateTime!
  resolvedAt: DateTime
  claimedByManagerId: ID
  claimedAt: DateTime
  "Optimistic concurrency token. Send it back on every REST mutation."
  version: Int!
  lastKnownLocation: GeoPoint

  """
  The timeline. Pass `after` with the highest sequence already applied to fetch only what
  is new, which is what the console does on reconnect.
  """
  events(after: Int = 0, limit: Int = 200): [AlertEvent!]!

  "Number of assigned workers notified. A count, never the workers themselves."
  notifiedWorkerCount: Int!
}

type AlertPage {
  items: [Alert!]!
  nextCursor: String
  hasMore: Boolean!
}

type QueueCounts {
  activeCount: Int!
  unclaimedCount: Int!
}

type Query {
  """
  The manager queue. Cursor pagination, never offset: alerts arrive continuously, and
  an offset window silently skips a row when something is inserted between pages.
  """
  alerts(
    status: AlertStatus
    priority: AlertPriority
    claimed: ClaimFilter
    limit: Int = 25
    cursor: String
  ): AlertPage!

  alert(id: ID!): Alert

  queueCounts: QueueCounts!
}

enum ClaimFilter {
  any
  mine
  unclaimed
}

type Subscription {
  """
  Live alert updates for the manager queue.

  Authorisation is checked per subscription, not only at connection. Without that, any
  authenticated user could subscribe to a stranger's alert and watch their location
  move.
  """
  alertUpdated(alertId: ID): Alert!

  queueChanged: QueueCounts!
}
