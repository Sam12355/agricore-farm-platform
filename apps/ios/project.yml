# XcodeGen project definition.
#
# The .xcodeproj is generated from this file rather than committed. A pbxproj is 3000
# lines of unreadable UUIDs that conflicts on every branch and that nobody can review; this
# is 100 lines that diff usefully and can be argued about in a pull request.
#
#   brew install xcodegen
#   xcodegen generate
#   open AgriCore.xcodeproj
#
# The generated project is gitignored, which is the point.

name: AgriCore

options:
  bundleIdPrefix: com.agricore
  deploymentTarget:
    iOS: '16.0'
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: '5.9'
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    # Warnings become errors. A warning nobody fixes is a warning nobody reads, and after
    # a few dozen of them the real one is invisible.
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    GCC_TREAT_WARNINGS_AS_ERRORS: YES
    CLANG_ENABLE_MODULE_VERIFIER: YES
    # No signing configuration anywhere in this file. There are no signing assets in this
    # repository and there never will be; CI injects them from named secrets.
    CODE_SIGN_STYLE: Manual
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGNING_ALLOWED: NO

configs:
  Debug: debug
  Staging: release
  Release: release

targets:
  AgriCore:
    type: application
    platform: iOS
    sources:
      - path: AgriCore
    dependencies:
      - target: AgriCoreWidget
      - target: AgriCoreIntents
    settings:
      base:
        INFOPLIST_FILE: AgriCore/Info.plist
        PRODUCT_NAME: AgriCore
        TARGETED_DEVICE_FAMILY: '1,2'
        # Dynamic Type and VoiceOver are tested, so the build should not silently disable
        # the things that make them work.
        ENABLE_BITCODE: NO
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: com.agricore.debug
          API_BASE_URL: http:/$()/localhost:3001
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
        Staging:
          PRODUCT_BUNDLE_IDENTIFIER: com.agricore.staging
          API_BASE_URL: https:/$()/staging.example.invalid
        Release:
          PRODUCT_BUNDLE_IDENTIFIER: com.agricore
          API_BASE_URL: https:/$()/api.example.invalid

  AgriCoreWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: AgriCoreWidget
    settings:
      base:
        INFOPLIST_FILE: AgriCoreWidget/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.agricore.widget

  AgriCoreIntents:
    type: app-extension
    platform: iOS
    sources:
      - path: AgriCoreIntents
    settings:
      base:
        INFOPLIST_FILE: AgriCoreIntents/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.agricore.intents

  AgriCoreTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: AgriCoreTests
    dependencies:
      - target: AgriCore
    settings:
      base:
        # The test target needs no network stubs, no simulator entitlements and no
        # StoreKit configuration, because every dependency is behind a protocol.
        BUNDLE_LOADER: $(TEST_HOST)

  AgriCoreUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: AgriCoreUITests
    dependencies:
      - target: AgriCore

schemes:
  AgriCore:
    build:
      targets:
        AgriCore: all
        AgriCoreWidget: all
        AgriCoreIntents: all
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - AgriCoreTests
        - AgriCoreUITests
    archive:
      config: Release
